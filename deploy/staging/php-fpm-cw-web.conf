; CW public web pool (UI + API) on the STAGING server, for warehouse-staging.floverfy.com.
; Installed by enable_https.sh as /etc/php/8.3/fpm/pool.d/cw-web.conf (once the DNS record existed);
; install_web.sh installs a changed copy on a box where the public vhost is already on.
;
; Serves /opt/cw-staging (the code copy that install_cron.sh maintains) against the real staging
; schema: there is NO CW_DB_NAME pin, so the schema is app.env `db_name` (cw_staging). Runs as
; www-data: it reads /etc/cw/app.env (0640 root:www-data: the cw_app login and ui_secret_key) and
; NOT /etc/cw/db.env. Opcache revalidates once a second so `install_cron.sh` (which re-syncs
; /opt/cw-staging) takes effect without a reload.

[cw-web]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm-cw-web.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Each busy worker holds one database connection; the staging cluster allows 76 in total and the
; cron jobs, the test slots and the hammer share it.
; dynamic, not ondemand: one or two workers wait idle, so the first page after a quiet minute does not
; wait for a fork, and their persistent database link (the staff screens: CW\Db::connect(..., true))
; skips the TCP + TLS + login handshake on the next page. Budget: a worker keeps at most one idle link
; (pm.max_children of them, 10 of the 76), plus the API's own while it answers an /v1 call; each
; worker is about 30-40 MB (opcache is shared), 10 of them well inside the box's 4 GB.
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 1000
request_terminate_timeout = 150s

clear_env = yes
env[CW_APP_ENV] = /etc/cw/app.env

php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/cw-web/php-error.log
php_admin_value[post_max_size] = 12M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 140
php_admin_value[opcache.revalidate_freq] = 1
