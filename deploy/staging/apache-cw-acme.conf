# warehouse-staging.floverfy.com on port 80: ACME http-01 challenges and a redirect to HTTPS,
# nothing else. Installed by enable_https.sh as /etc/apache2/sites-available/cw-acme.conf, BEFORE
# the certificate exists (apache-cw-https.conf needs the certificate files, so it comes second).
# The Ubuntu default page on *:80 keeps answering every other Host, as it does today.
#
# NOT enabled until enable_https.sh runs, and that script refuses until the DNS record exists.

<VirtualHost *:80>
    ServerName warehouse-staging.floverfy.com
    DocumentRoot /var/lib/cw-acme
    ServerSignature Off

    <Directory /var/lib/cw-acme>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    # Everything except the challenge goes to HTTPS.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://warehouse-staging.floverfy.com%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/cw-acme.error.log
    CustomLog ${APACHE_LOG_DIR}/cw-acme.access.log combined
</VirtualHost>
