; CW /ui staff screens php-fpm pool on the STAGING server — slot "ui" (/opt/cw-ui). Installed by
; install_ui.sh as /etc/php/8.3/fpm/pool.d/cw-ui.conf.
;
; Same front controller (public/index.php) as the API, its own pool so a test run in this slot
; never shares workers, opcache or an error log with the api slot. Runs as www-data: it reads
; /etc/cw/app.env (0640 root:www-data: the cw_app login and ui_secret_key) and NOT /etc/cw/db.env.
; CW_DB_NAME pins the schema this instance serves: the ui slot's test schema, which
; tests/bootstrap.php re-creates on every PHPUnit run (tests/Integration/Ui*Test.php).

[cw-ui]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm-cw-ui.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Each busy worker holds one database connection (the UI opens one per request); the staging
; cluster allows 76 in total.
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 60s
pm.max_requests = 1000
request_terminate_timeout = 60s

clear_env = yes
env[CW_APP_ENV] = /etc/cw/app.env
env[CW_DB_NAME] = cw_test_ui

php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/cw-ui/php-error.log
php_admin_value[post_max_size] = 2M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 50
; the slot directory is re-synced by scripts/remote.sh before every run: see edits at once
php_admin_value[opcache.revalidate_freq] = 0
