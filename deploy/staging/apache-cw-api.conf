# CW /v1 API on the STAGING server — slot "api" (/opt/cw-api). Installed by install_api.sh as
# /etc/apache2/sites-available/cw-api.conf.
#
# Loopback only: Apache listens on 127.0.0.1:8080 and nothing else for this site, so the API is
# never reachable from outside the box (tests and curl run on the box itself). Production gets
# its own TLS vhost on warehouse.floverfy.com (DNS-only, so REMOTE_ADDR is the site's address).
#
# REMOTE_ADDR is the only client address the app trusts: mod_remoteip must stay disabled.

Listen 127.0.0.1:8080

<VirtualHost 127.0.0.1:8080>
    ServerName cw-api.staging.invalid
    DocumentRoot /opt/cw-api/public
    # TRACE would echo the Authorization header back; no server banner on Apache's own pages.
    TraceEnable Off
    ServerSignature Off

    # Largest body the app accepts is 8 MB (Request::MAX_BODY_BYTES); refuse far larger early.
    LimitRequestBody 12582912

    # Every path goes to the front controller; nothing else under public/ is served.
    RewriteEngine On
    RewriteRule ^ /opt/cw-api/public/index.php [END]

    <Directory /opt/cw-api/public>
        Options None
        AllowOverride None
        Require local
        # Pass the Authorization header (Bearer key) to PHP-FPM.
        CGIPassAuth On
        <FilesMatch "^index\.php$">
            SetHandler "proxy:unix:/run/php/php8.3-fpm-cw-api.sock|fcgi://cw-api-fpm"
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/cw-api.error.log
    # The access log never contains the Authorization header.
    CustomLog ${APACHE_LOG_DIR}/cw-api.access.log combined
</VirtualHost>
