# CW UI + /v1 API on the STAGING server over HTTPS: warehouse-staging.floverfy.com (46.101.55.135).
# Installed by enable_https.sh as /etc/apache2/sites-available/cw-https.conf.
#
# NOT ENABLED. Nothing in deploy/staging installs or enables this file until enable_https.sh is
# run by a person, and that script refuses until the DNS record for the name resolves to this
# box. Until then the UI is reachable on the box only (apache-cw-ui.conf, 127.0.0.1:8080).
#
# One host name, one front controller (public/index.php): /ui/* is the staff screens (password +
# TOTP + session cookie, Secure and SameSite=Strict here because the request is HTTPS), /v1/* is
# the site API (bearer key + the channel's IP allowlist). It serves /opt/cw-staging against the
# real staging schema (pool cw-web, app.env `db_name`), never a test schema.
#
# The record is DNS-only (not behind Cloudflare or any proxy): REMOTE_ADDR is the real client
# address, the only one the app trusts (login rate limits, audit_log, the API allowlist).
# mod_remoteip must stay disabled.

<VirtualHost *:443>
    ServerName warehouse-staging.floverfy.com
    DocumentRoot /opt/cw-staging/public

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/warehouse-staging.floverfy.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/warehouse-staging.floverfy.com/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLSessionTickets off

    # The UI sends its own HSTS; the API answers get it here.
    Header always setifempty Strict-Transport-Security "max-age=31536000"

    # Largest API body is 8 MB (Request::MAX_BODY_BYTES); refuse far larger early.
    LimitRequestBody 12582912

    # Every path (pages, /ui/assets/*, /v1/*) goes to the front controller; nothing else under
    # public/ is served by Apache itself.
    RewriteEngine On
    # The bare host name is what people type: send it to the staff sign-in, not to the API root.
    RewriteRule ^/$ /ui/ [R=302,L]
    RewriteRule ^ /opt/cw-staging/public/index.php [END]

    <Directory /opt/cw-staging/public>
        Options None
        AllowOverride None
        Require all granted
        # Pass the Authorization header (Bearer key) to PHP-FPM.
        CGIPassAuth On
        <FilesMatch "^index\.php$">
            SetHandler "proxy:unix:/run/php/php8.3-fpm-cw-web.sock|fcgi://cw-web-fpm"
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/cw-https.error.log
    # The access log never contains the Authorization header or cookies.
    CustomLog ${APACHE_LOG_DIR}/cw-https.access.log combined
</VirtualHost>
