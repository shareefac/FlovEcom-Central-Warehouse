# Server-wide Apache settings for the public CW vhost (server config only: not valid inside a
# <VirtualHost>). Installed by enable_https.sh as /etc/apache2/conf-available/cw-hardening.conf.
# The production notes (docs/decisions.md, "API, production") ask for ServerTokens Prod.
ServerTokens Prod
ServerSignature Off
TraceEnable Off
