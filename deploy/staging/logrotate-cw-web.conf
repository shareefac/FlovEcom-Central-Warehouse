# CW public web logs on staging (warehouse-staging.floverfy.com). Installed by enable_https.sh as
# /etc/cw/logrotate-cw-web.conf and run HOURLY from /etc/cron.d/cw-web-logrotate with its own state
# file: this vhost is reachable from the internet, so unauthenticated traffic must not be able to
# fill the disk between daily logrotate runs (R18). Size-based; copytruncate because the php-fpm
# pool keeps its error_log open between requests.
/var/log/cw-web/*.log {
    su www-data www-data
    size 20M
    rotate 10
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
