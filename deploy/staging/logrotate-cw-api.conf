# CW /v1 API logs on staging (R18). Installed by install_api.sh as /etc/cw/logrotate-cw-api.conf and
# run HOURLY from /etc/cron.d/cw-api-logrotate with its own state file, so an unauthenticated flood
# (Auth logs one line per missing/unknown key) cannot fill the disk between daily logrotate runs.
# Size-based; copytruncate because the php-fpm pool keeps its error_log open between requests.
# Carry the same rule into the production vhost.
/var/log/cw-api/*.log {
    su www-data www-data
    size 20M
    rotate 10
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
