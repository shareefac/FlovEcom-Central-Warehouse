# CW /ui staff screens on the STAGING server — slot "ui" (/opt/cw-ui). Installed by install_ui.sh
# as /etc/apache2/sites-available/cw-ui.conf.
#
# A second NAME-BASED vhost on the loopback listener that cw-api.conf already opens
# (127.0.0.1:8080): a request with `Host: cw-ui.staging.invalid` reaches the ui slot's pool
# (schema cw_test_ui); every other Host still gets the api slot (cw-api.conf is loaded first, so
# it stays the default vhost and the API tests are unaffected). There is deliberately NO Listen
# line here: a second Listen for the same address stops Apache from starting.
#
# Loopback only, like the API: the UI tests and curl run on the box itself. The public HTTPS vhost
# for warehouse-staging.floverfy.com is a separate file (apache-cw-https.conf, NOT enabled).
#
# REMOTE_ADDR is the only client address the app trusts (login rate limits, audit): mod_remoteip
# must stay disabled.

<VirtualHost 127.0.0.1:8080>
    ServerName cw-ui.staging.invalid
    DocumentRoot /opt/cw-ui/public
    TraceEnable Off
    ServerSignature Off

    # The largest form is a few KB.
    LimitRequestBody 2097152

    # Every path (pages, /ui/assets/*) goes to the front controller; nothing else under public/
    # is served by Apache itself.
    RewriteEngine On
    RewriteRule ^ /opt/cw-ui/public/index.php [END]

    <Directory /opt/cw-ui/public>
        Options None
        AllowOverride None
        Require local
        CGIPassAuth On
        <FilesMatch "^index\.php$">
            SetHandler "proxy:unix:/run/php/php8.3-fpm-cw-ui.sock|fcgi://cw-ui-fpm"
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/cw-ui.error.log
    # Cookies are not logged by "combined"; the request line of a login POST carries no secret.
    CustomLog ${APACHE_LOG_DIR}/cw-ui.access.log combined
</VirtualHost>
