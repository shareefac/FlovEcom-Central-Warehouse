; CW /v1 API php-fpm pool on the STAGING server — slot "api" (/opt/cw-api). Installed by
; install_api.sh as /etc/php/8.3/fpm/pool.d/cw-api.conf.
;
; Runs as www-data, which can read /etc/cw/app.env (0640 root:www-data) but NOT /etc/cw/db.env
; (0600 root): the web process only ever has the app login (cw_app), never doadmin.
; CW_DB_NAME pins the schema this instance serves: the api slot's test schema, which
; tests/bootstrap.php re-creates on every PHPUnit run (tests/Integration/Api*Test.php).

[cw-api]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm-cw-api.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Each busy worker holds one database connection; the staging cluster allows 76 in total.
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 60s
pm.max_requests = 1000
request_terminate_timeout = 150s

clear_env = yes
env[CW_APP_ENV] = /etc/cw/app.env
env[CW_DB_NAME] = cw_test_api

php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/cw-api/php-error.log
php_admin_value[post_max_size] = 12M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 140
; the slot directory is re-synced by scripts/remote.sh before every run: see edits at once
php_admin_value[opcache.revalidate_freq] = 0
