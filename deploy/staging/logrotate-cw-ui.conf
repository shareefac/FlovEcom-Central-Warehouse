# CW /ui logs on staging. Installed by install_ui.sh as /etc/cw/logrotate-cw-ui.conf and run HOURLY
# from /etc/cron.d/cw-ui-logrotate with its own state file (same reasoning as logrotate-cw-api.conf:
# a login form is reachable by anyone who can reach the vhost, and every failed request logs a line).
# Size-based; copytruncate because the php-fpm pool keeps its error_log open between requests.
/var/log/cw-ui/*.log {
    su www-data www-data
    size 20M
    rotate 10
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
