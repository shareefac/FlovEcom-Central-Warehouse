# CW UI + /v1 API on the PRODUCTION server over HTTPS: warehouse.floverfy.com (129.212.162.243).
# Installed by deploy/production/enable_https.sh as /etc/apache2/sites-available/cw-https.conf (a re-run installs a
# changed copy).
#
# NOT ENABLED until a person runs enable_https.sh, which refuses unless the DNS record for the name resolves to
# the box's reserved address only.
#
# One host name, one front controller (public/index.php): /ui/* is the staff screens (password +
# TOTP + session cookie, Secure and SameSite=Strict here because the request is HTTPS), /v1/* is
# the site API (bearer key + the channel's IP allowlist). It serves /opt/cw-prod against the
# production schema (pool cw-web, app.env `db_name` = cw_prod), never a test schema.
#
# The record is DNS-only (not behind Cloudflare or any proxy): REMOTE_ADDR is the real client
# address, the only one the app trusts (login rate limits, audit_log, the API allowlist).
# mod_remoteip must stay disabled.

<VirtualHost *:443>
    ServerName warehouse.floverfy.com
    DocumentRoot /opt/cw-prod/public

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/warehouse.floverfy.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/warehouse.floverfy.com/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLSessionTickets off

    # HTTP/2 (mod_http2, mpm_event): a page and its two assets share one connection. A browser that is
    # reading a page keeps that connection for a minute, so the next click needs no new TLS handshake.
    Protocols h2 http/1.1
    KeepAliveTimeout 60

    # The UI sends its own HSTS; the API answers get it here.
    Header always setifempty Strict-Transport-Security "max-age=31536000"

    # Largest API body is 8 MB (Request::MAX_BODY_BYTES); refuse far larger early.
    LimitRequestBody 12582912

    # Every path (pages, /ui/assets/*, /v1/*) goes to the front controller; nothing else under
    # public/ is served by Apache itself.
    RewriteEngine On
    # The bare host name is what people type: send it to the staff sign-in, not to the API root.
    RewriteRule ^/$ /ui/ [R=302,L]
    # Browsers ask for /favicon.ico on every page; CW has none. Answer here (404) instead of starting PHP for
    # the API's 401.
    RewriteRule ^/favicon\.ico$ - [R=404,L]
    RewriteRule ^ /opt/cw-prod/public/index.php [END]

    <Directory /opt/cw-prod/public>
        Options None
        AllowOverride None
        Require all granted
        # Pass the Authorization header (Bearer key) to PHP-FPM.
        CGIPassAuth On
        <FilesMatch "^index\.php$">
            SetHandler "proxy:unix:/run/php/php8.3-fpm-cw-web.sock|fcgi://cw-web-fpm"
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/cw-https.error.log
    # The access log never contains the Authorization header or cookies.
    CustomLog ${APACHE_LOG_DIR}/cw-https.access.log combined
</VirtualHost>
